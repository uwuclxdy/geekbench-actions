name: Geekbench — Linux

# Manual run of Geekbench on a GitHub-hosted Ubuntu runner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Geekbench version
        type: string
        default: "6.7.1"
      extra_args:
        description: Extra geekbench6 CLI args
        type: string
        default: "--cpu"

jobs:
  linux:
    uses: ./.github/workflows/_geekbench.yml
    with:
      os: ubuntu-latest
      version: ${{ inputs.version }}
      extra_args: ${{ inputs.extra_args }}
    secrets: inherit
