name: Geekbench (Linux)

# Manual run of Geekbench on a GitHub-hosted Ubuntu runner.
# Wrapper around _geekbench.yml; see the run summary for the result URL.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Geekbench version
        type: string
        default: "7.0.0"
      extra_args:
        description: Extra Geekbench CLI args
        type: string
        default: "--cpu"

jobs:
  linux:
    uses: ./.github/workflows/_geekbench.yml
    with:
      os: ubuntu-latest
      version: ${{ inputs.version }}
      extra_args: ${{ inputs.extra_args }}
    secrets: inherit
